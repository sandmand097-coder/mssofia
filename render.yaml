services:
  - type: web
    name: mssofia
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_LAUNCH_MODE
        value: preview
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PG_POOL_MAX
        value: "3"
      - key: PGSSL
        value: required
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: SCHOOL_PRIVACY_APPROVED
        value: "false"
      - key: SCHOOL_CONTACT_EMAIL
        sync: false
      - key: VODAFONE_CASH_NUMBER
        value: "01027661546"
      - key: SCHOOL_SUPPORT_PHONE
        value: "01027661546"
      - key: SCHOOL_ADMIN_EMAIL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
