name: Miss Sofia premium WhatsApp direct contact QA

on:
  push:
    branches: [feature/whatsapp-premium-direct-contact-20261011]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: whatsapp-direct-contact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Premium WhatsApp UX & existing production regressions
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate source and API syntax
        run: npm run check
      - name: Test existing payments/permissions and WhatsApp route safety
        run: npm test
        env:
          NODE_ENV: test
          PUBLIC_LAUNCH_MODE: preview
          REGISTRATION_ENABLED: "false"
      - name: Build production website
        run: npm run build
      - name: Install Chromium
        run: npx --yes playwright@1.64.0 install --with-deps chromium
      - name: Verify contact, footer and classroom isolation on mobile & desktop
        run: npm run test:whatsapp:browser
      - name: Preserve responsive screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-whatsapp-responsive-previews
          path: qa-artifacts/whatsapp-contact/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Audit runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=high
