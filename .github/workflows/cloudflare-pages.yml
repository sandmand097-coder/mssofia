name: Deploy Miss Sofia to Cloudflare Pages

# Deployment is allowed only after quality passes AND the corresponding backend
# commit is already live and ready on Render. This workflow never deploys PR code.
on:
  workflow_run:
    workflows: ["Miss Sofia quality gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  deployments: write

concurrency:
  group: mssofia-cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    name: Publish only the audited, live Render commit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Confirm current main and successful quality check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main > current-main.txt
          current="$(cut -f1 current-main.txt)"
          if [ "$current" != "$RELEASE_SHA" ]; then
            echo "::error::Release commit is no longer the head of main. No deployment."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "API, payment, moderation and production build" and .conclusion == "success")] | length' > verified-check.txt
          if [ "$(cat verified-check.txt)" -lt 1 ]; then
            echo "::error::Required quality workflow has not succeeded for this exact commit."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Recheck release tests
        run: |
          npm run check
          npm test
          npm run build
          npm run test:seo:build

      - name: Verify Render is already serving this commit with a ready database
        env:
          EXPECTED_RENDER_SHA: ${{ env.RELEASE_SHA }}
        run: node scripts/verify-render-release.mjs

      - name: Reject a branch head change during validation
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)"
          test "$current" = "$RELEASE_SHA" || {
            echo "::error::main changed during validation; refusing to deploy the stale build."
            exit 1
          }

      - name: Require Cloudflare deployment token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_TOKEN" || {
            echo "::error::Cloudflare API token is missing; deployment cannot be reported successful."
            exit 1
          }

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dcf6eec87a6a6b454acc0d9f7deff984
          wranglerVersion: '4.149.0'
          command: pages deploy dist --project-name=mssofia --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production visitor pages and privacy gates (GET-only)
        env:
          SITE_ORIGIN: https://mssofia.pages.dev
          EXPECTED_LAUNCH_MODE: full
        run: node scripts/run-production-risk-probe.mjs
