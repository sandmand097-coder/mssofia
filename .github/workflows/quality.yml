name: Miss Sofia quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: API, payment, moderation and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check server syntax
        run: npm run check
      - name: Run isolated API and authorization tests
        run: npm test
        env:
          NODE_ENV: test
          PUBLIC_LAUNCH_MODE: preview
          REGISTRATION_ENABLED: 'false'
      - name: Build production website
        run: npm run build
      - name: Install isolated headless browser
        run: npx --yes playwright@1.64.0 install --with-deps chromium
      - name: Verify transient classroom recovery and permanent denial in browser
        run: node qa-classroom-join-recovery-browser.mjs
      - name: Verify early live classroom entry on mobile and desktop
        run: node qa-classroom-entry-browser.mjs
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
